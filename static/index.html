<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Video Chat</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <h1>📹 Video Chat</h1>
    <span class="room-info">
      Room: <strong id="room-name"></strong>
      — <a href="#" id="copy-link" onclick="copyLink(event)">copy invite link</a>
    </span>
  </header>

  <div id="landing">
    <h2>Ready to join?</h2>
    <input id="name-input" type="text" placeholder="Your name (optional)" maxlength="32"
           onkeydown="if(event.key==='Enter') joinRoom()">
    <input id="password-input" type="password" placeholder="Room password" maxlength="64"
           onkeydown="if(event.key==='Enter') joinRoom()" class="hidden">
    <p class="note">Camera &amp; mic access will be requested.<br>You can join without them if denied.</p>
    <p id="error-msg" class="note" style="color:#e74c3c;display:none"></p>
    <button id="join-btn" onclick="joinRoom()">Join Room</button>
  </div>

  <div id="main" class="hidden">
    <div id="video-area">
      <div id="video-grid"></div>
      <div id="screen-layout" class="hidden">
        <div id="screen-featured">
          <video id="screen-video" autoplay playsinline muted></video>
          <div class="video-label" id="screen-label"></div>
        </div>
        <div id="tile-strip"></div>
      </div>
    </div>
    <div id="chat-panel" class="hidden">
      <div id="chat-header">
        <span>💬 Chat</span>
        <button id="chat-close" onclick="toggleChat()" title="Close chat">✕</button>
      </div>
      <div id="chat-messages"></div>
      <div id="chat-form">
        <input id="chat-input" type="text" placeholder="Message…" maxlength="500"
               onkeydown="if(event.key==='Enter') sendChat()">
        <button id="chat-send" onclick="sendChat()">Send</button>
      </div>
    </div>
  </div>

  <div id="toolbar">
    <button id="btn-mic" onclick="toggleMic()">🎤<span class="btn-label"> Mute</span></button>
    <button id="btn-cam" onclick="toggleCam()">📷<span class="btn-label"> Hide</span></button>
    <button id="btn-screen" onclick="toggleScreenShare()">🖥️<span class="btn-label"> Share</span></button>
    <button id="btn-chat" onclick="toggleChat()">💬<span class="btn-label"> Chat</span><span id="chat-badge"></span></button>
    <button onclick="leaveRoom()">🚪<span class="btn-label"> Leave</span></button>
  </div>

<script src="/app.js"></script>
</body>
</html>
