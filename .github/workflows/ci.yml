name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-go:
    name: Go Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go vet ./service/...
      - run: go test -race -count=1 -timeout 60s -coverprofile=coverage.out ./service/...
      - name: Upload coverage
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: go-coverage
          path: coverage.out

  test-js:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: www/package-lock.json
      - run: cd www && npm ci
      - run: cd www && npm test

  build:
    name: Build (${{ matrix.goarch }})
    runs-on: ubuntu-latest
    needs: [test-go]
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: GOOS=linux GOARCH=${{ matrix.goarch }} CGO_ENABLED=0 go build -ldflags="-w -s" -o videochat-${{ matrix.goarch }} ./service
      - uses: actions/upload-artifact@v7
        with:
          name: videochat-linux-${{ matrix.goarch }}
          path: videochat-${{ matrix.goarch }}
