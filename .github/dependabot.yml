version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps(go):"
    labels:
      - dependencies
      - go

  - package-ecosystem: npm
    directory: /www
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps(npm):"
    labels:
      - dependencies
      - javascript

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps(actions):"
    labels:
      - dependencies
      - ci
