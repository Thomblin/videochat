# Nginx reverse-proxy configuration for videochat
#
# Install:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/videochat
#   sudo ln -s /etc/nginx/sites-available/videochat /etc/nginx/sites-enabled/videochat
#   sudo nginx -t && sudo systemctl reload nginx
#
# The Go binary listens on 127.0.0.1:8083.
# Adjust server_name and the port if needed.
#
# add certs and ssl with
# sudo certbot --nginx -d chat.example.de

server {
    listen 80;
    listen [::]:80;
    server_name chat.example.de;   # replace with your hostname or IP

    # Optional: redirect to HTTPS if you add a cert later
    # return 301 https://$host$request_uri;

    location / {
        proxy_pass         http://127.0.0.1:8083;
        proxy_http_version 1.1;

        # Required for WebSocket (/ws endpoint)
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Keep WebSocket connections alive
        proxy_connect_timeout 5s;
        proxy_read_timeout    3600s;
        proxy_send_timeout    3600s;
    }
}
