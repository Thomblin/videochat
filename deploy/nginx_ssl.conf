# Nginx reverse-proxy configuration for chat.example.de
#
# Install:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/chat.example.de
#   sudo ln -s /etc/nginx/sites-available/chat.example.de /etc/nginx/sites-enabled/chat.example.de
#   sudo nginx -t && sudo systemctl reload nginx
#
# The Go binary listens on 127.0.0.1:8080.
# Adjust server_name and the port if needed.

server {
    server_name chat.example.de;

    # Optional: redirect to HTTPS if you add a cert later
    # return 301 https://$host$request_uri;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    location / {
        proxy_pass         http://localhost:8083;
        proxy_http_version 1.1;

        # Required for WebSocket (/ws endpoint)
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Keep WebSocket connections alive
        proxy_connect_timeout 5s;
        proxy_read_timeout    3600s;
        proxy_send_timeout    3600s;
    }

    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl;
    ssl_certificate /etc/letsencrypt/live/chat.example.de/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/chat.example.de/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = chat.example.de) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name chat.example.de;
    return 404; # managed by Certbot


}